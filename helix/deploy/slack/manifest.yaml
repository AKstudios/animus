display_information:
  name: Helix
  description: Turns a Slack message into a pull request. Draft a spec in a thread, submit it, and follow the job here.
  long_description: Helix is the team's software factory. Describe a change in a DM or with /helix draft, with links to the issue or thread it comes from, and Helix drafts a spec with acceptance criteria. Reply in the thread to change it, then press Submit. Helix builds it on the office machine, checks every criterion, and opens a pull request with the proof. While the job runs, its thread shows its progress, asks you when it needs an answer, and lets you cancel it. /helix help lists every command.
  background_color: "#0a0e11"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Helix
    always_online: true
  slash_commands:
    - command: /helix
      description: Draft a job's spec, set a channel's project, see your jobs and Helix's load, invite someone, link a Slack user, or turn job notifications off and on
      usage_hint: help | draft <text> | jobs | job <id> | cancel <id> | status | project <name> | notify off|on | invite @user <github-login> | link @user <person>
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - im:history
      - app_mentions:read
      - files:read
      - files:write
settings:
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
