display_information:
  name: Helix
  description: Invites people to Helix and posts their jobs' progress to them.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Helix
    always_online: true
  slash_commands:
    - command: /helix
      description: Invite someone, link a Slack user, or turn job notifications off and on
      usage_hint: invite @user <github-login> | link @user <person> | notify off|on
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
