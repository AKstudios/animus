# Task profiles: the one file that decides what a job runs (docs/factory.md,
# "Task profiles"). Size picks the stages, difficulty picks the model tier and
# effort, type adds a gate, a reviewer or a kind of evidence. Profiles name a
# tier, never a model; `providers` maps tiers to models.

provider: claude

providers:
  claude:
    fast: haiku
    standard: sonnet
    deep: opus

# Both loops are bounded: the gates send work back at most gate_rounds times
# in a job, the review review_rounds times.
limits:
  gate_rounds: 2
  review_rounds: 1
  # How full a session's context may get, in tokens. A session that ended past
  # context_budget is not resumed for the next round: a fresh one is started
  # and told what was done. context_cap is where the provider compacts a
  # session that is still running (Claude Code takes 100000 or more).
  context_budget: 100000
  context_cap: 160000
  # The most one session may spend, in dollars, by tier. A session that
  # reaches it is ended and the job stops as failed.
  session_usd: { fast: 2, standard: 8, deep: 20 }

# The planner: a read-only session that cuts a spec into slices before any
# code is written (src/slices.ts). A size not listed in `sizes` is one slice,
# by script, with no session. A plan with more than max_slices is refused.
planner:
  tier: standard
  effort: medium
  sizes: [medium, large]
  max_slices: 8

# The drafter: a session that writes a spec from a Slack message and the
# references a script fetched for it (src/draft.ts). It reads files and
# nothing else, and stops at max_usd dollars.
drafter:
  tier: fast
  effort: low
  max_usd: 0.5

# The retro: a session that reads a project's recent run records, assembled by
# a script, and proposes lessons (src/retro.ts). It reads files and nothing
# else, has no worktree, and stops at max_usd dollars.
retro:
  tier: standard
  effort: medium
  max_usd: 2

sizes:
  trivial:
    looks_like: Typo, copy, config value, one or two files
    setup: deps        # clone and dependencies only
    gates: affected    # a command's `affected` form where the project's profile has one
    review: none
  small:
    looks_like: A few files, follows a known pattern
    setup: services    # services only if the tests need them
    gates: full
    review: fast
  medium:
    looks_like: A feature across layers, roughly 5 to 20 files
    setup: full
    gates: full
    review: standard
  large:
    looks_like: Multi-module work or schema changes
    setup: full
    gates: full
    review: deep       # one reviewer reads the whole diff of every slice
    # Run only as slices: a large spec whose cut is not taken fails before any code is written.

difficulties:
  routine:
    signals: Follows an existing pattern in the repo
    tier: standard
    effort: medium
    sizes:
      trivial: { tier: fast, effort: low }
  hard:
    signals: Unfamiliar area, cross-cutting change, unclear root cause
    tier: standard
    effort: high
    sizes:
      medium: { tier: deep }
  risky:
    signals: Auth, payments, migrations, data deletion
    tier: deep
    effort: high
    review: deep       # always reviewed, whatever the size

# A type with `later` is defined but not built: its spec is rejected with that reason.
types:
  feature: {}
  backend: {}
  ui:
    setup: full
    reviewer: ui-reviewer
    evidence: [screenshots]
  bug:
    prove: fails-on-base   # a gate: an acceptance command must fail on the base commit with only the job's test files added
  refactor:
    later: the gate that flags edited test files is not built yet
  upgrade:
    later: the upgrade script is not built yet
  migration:
    later: migrations need the database template, which arrives with containers
  performance:
    later: the before-and-after benchmark evidence is not built yet
  docs:
    later: the docs path that skips the test gates is not built yet
  tests:
    later: the tests-only path is not built yet
  investigation:
    later: a job whose output is a findings report is not built yet

# Which role gets which vendored skill (plugin/vendor/), and which of its files
# is put in that role's instructions. A role not named here gets none. `types`
# limits a skill to jobs of those types. Sessions cannot reach any other skill:
# not the person's own, not Claude Code's built-in ones.
skills:
  to-tickets:
    roles:
      planner: SKILL.md
  ponytail:
    roles:
      implementer: SKILL.md
  useful-tests:
    roles:
      implementer: SKILL.md
  tdd:
    types: [bug]
    roles:
      implementer: SKILL.md
  impeccable:
    types: [ui]
    roles:
      implementer: SKILL.md
      ui-reviewer: reference/craft-floor.md
